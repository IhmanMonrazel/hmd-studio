<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sélection de l'opératrice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

</head>
<body>
<div id="safe"></div>
<div id="view"><div id="fit"><div id="stage">

  <div class="top"><div style="display:flex;align-items:center;gap:36px"><h1>OPÉRATRICES</h1><div class="tabs"><span class="on">SÉLECTION</span><span>ÉQUIPEMENT</span><span>TENUES</span></div></div><div class="who"><span>JOUEUSE 1 <b>· EN LIGNE</b></span><button id="snd" type="button" aria-pressed="true">SON ACTIVÉ</button></div></div>

  <div id="hero"><img id="heroImg" alt=""></div>

    <div id="gear"></div>
    <div id="stats"></div>
  </div>

  <div id="flash" aria-hidden="true"></div>
  <div id="title" role="button" tabindex="0" aria-label="Appuyer pour commencer"><div class="t0">JOUEUSE 1</div><div class="t1">OPÉRATRICES</div><div class="t2">APPUYER POUR COMMENCER</div></div>
</div></div></div>

<script src="app.js"></script>
